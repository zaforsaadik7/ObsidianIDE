<body class="bg-surface-dark dark:bg-surface-dark light:bg-surface-light text-on-surface dark:text-on-surface light:text-surface-dark font-body-md overflow-hidden h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- TopNavBar -->
<header class="fixed top-0 w-full z-50 bg-surface-container dark:bg-surface-container light:bg-surface-light border-b border-outline-variant flex justify-between items-center h-12 px-margin-mobile md:px-margin-desktop w-full transition-all duration-100 ease-linear">
<div class="font-label-caps text-label-caps tracking-widest text-primary dark:text-primary light:text-inverse-primary">NEURAL_IDE</div>
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-variant transition-colors duration-150 p-2 rounded" id="theme-toggle" onclick="toggleTheme()">dark_mode</button>
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-variant transition-colors duration-150 p-2 rounded">account_circle</button>
</div>
</header>
<!-- Main Content: Centered Glass Card -->
<main class="flex-1 flex items-center justify-center relative overflow-hidden px-margin-mobile">
<!-- Auth Card Container -->
<div class="w-full max-w-md z-10">
<!-- Login Form -->
<div class="glass-panel p-8 shadow-2xl flex flex-col gap-8 transition-opacity duration-300" id="login-form">
<div class="space-y-2">
<h1 class="font-headline-lg text-headline-lg text-primary dark:text-primary light:text-inverse-primary">Login</h1>
<p class="font-code-md text-code-md text-on-surface-variant opacity-70">SYSTEM STATUS: RESTRICTED_ACCESS</p>
</div>
<div class="space-y-6">
<div class="group">
<label class="font-label-caps text-label-caps text-on-surface-variant block mb-2">EMAIL_IDENTIFIER</label>
<input class="w-full bg-surface-slate dark:bg-surface-slate light:bg-white/50 border-b-2 border-outline-variant focus:border-primary-container p-3 font-code-md text-code-md transition-all duration-200" id="login-email" placeholder="USER@NEURAL.SYS" type="email">
</div>
<div class="group">
<label class="font-label-caps text-label-caps text-on-surface-variant block mb-2">PASSPHRASE_KEY</label>
<input class="w-full bg-surface-slate dark:bg-surface-slate light:bg-white/50 border-b-2 border-outline-variant focus:border-primary-container p-3 font-code-md text-code-md transition-all duration-200" id="login-password" placeholder="••••••••••••" type="password">
<p class="hidden text-error text-[10px] mt-1 font-code-md" id="login-error">ERROR: INVALID_CREDENTIALS</p>
</div>
</div>
<div class="flex flex-col gap-4">
<button class="w-full py-4 bg-surface-variant text-on-surface font-label-caps text-label-caps tracking-widest disabled:opacity-50 disabled:cursor-not-allowed hover:bg-primary-container hover:text-on-primary-container transition-colors duration-200 uppercase" disabled="" id="login-submit">Login</button>
<button class="font-code-md text-code-md text-primary dark:text-primary light:text-inverse-primary hover:text-neon-green transition-colors text-center w-full" onclick="toggleAuth('register')">New here? Sign Up</button>
</div>
</div>
<!-- Registration Form (Hidden by default) -->
<div class="hidden glass-panel p-8 shadow-2xl flex-col gap-8 transition-opacity duration-300" id="register-form">
<div class="space-y-2">
<h1 class="font-headline-lg text-headline-lg text-primary dark:text-primary light:text-inverse-primary">CREATE_CREDENTIALS</h1>
<p class="font-code-md text-code-md text-on-surface-variant opacity-70">NODE ENROLLMENT: PENDING</p>
</div>
<div class="space-y-6">
<div class="group">
<label class="font-label-caps text-label-caps text-on-surface-variant block mb-2">FULL_NAME</label>
<input class="w-full bg-surface-slate dark:bg-surface-slate light:bg-white/50 border-b-2 border-outline-variant focus:border-primary-container p-3 font-code-md text-code-md transition-all duration-200" id="reg-name" placeholder="ARCHITECT NAME" type="text">
</div>
<div class="group">
<label class="font-label-caps text-label-caps text-on-surface-variant block mb-2">EMAIL_IDENTIFIER</label>

</div>
<div class="group">
<label class="font-label-caps text-label-caps text-on-surface-variant block mb-2">NEW_PASSPHRASE</label>

</div>
</div>

                    Confirm Identity
                </button>
<button class="font-code-md text-code-md text-primary dark:text-primary light:text-inverse-primary hover:text-neon-green transition-colors text-center w-full" onclick="toggleAuth('login')">
                    Already have credentials? Login

&gt; Session: NULL_UNDEFINED

<!-- Footer -->

<script>
    // Theme Toggle Function
    function toggleTheme() {
        const html = document.documentElement;
        const toggleBtn = document.getElementById('theme-toggle');
        if (html.classList.contains('dark')) {
            html.classList.remove('dark');
            if (toggleBtn) toggleBtn.textContent = 'light_mode';
            localStorage.setItem('theme', 'light');
        } else {
            html.classList.add('dark');
            if (toggleBtn) toggleBtn.textContent = 'dark_mode';
            localStorage.setItem('theme', 'dark');
        }
    }

    // Toggle between Login and Register Forms
    function toggleAuth(type) {
        const login = document.getElementById('login-form');
        const register = document.getElementById('register-form');
        
        if (type === 'register') {
            login.classList.add('hidden');
            login.classList.remove('flex');
            register.classList.remove('hidden');
            register.classList.add('flex');
        } else {
            register.classList.add('hidden');
            register.classList.remove('flex');
            login.classList.remove('hidden');
            login.classList.add('flex');
        }
    }

    // Form Validation Logic
    const forms = [
        { email: 'login-email', pass: 'login-password', btn: 'login-submit' },
        { name: 'reg-name', email: 'reg-email', pass: 'reg-password', btn: 'reg-submit' }
    ];

    forms.forEach(f => {
        const inputs = [document.getElementById(f.email), document.getElementById(f.pass)];
        if (f.name) inputs.push(document.getElementById(f.name));
        const btn = document.getElementById(f.btn);

        inputs.forEach(input => {
            input.addEventListener('input', () => {
                const allFilled = inputs.every(i => i.value.trim().length > 3);
                if (allFilled) {
                    btn.removeAttribute('disabled');
                    btn.classList.replace('bg-surface-variant', 'bg-primary-container');
                    btn.classList.replace('text-on-surface', 'text-on-primary-container');
                } else {
                    btn.setAttribute('disabled', 'true');
                    btn.classList.replace('bg-primary-container', 'bg-surface-variant');
                    btn.classList.replace('text-on-primary-container', 'text-on-surface');
                }
            });
        });

        // Submit Logic (Error display without animations)
        btn.addEventListener('click', (e) => {
            const passInput = document.getElementById(f.pass);
            const errorMsg = document.getElementById('login-error');
            
            if (passInput.value === 'error') {
                passInput.classList.add('border-error');
                if(errorMsg) errorMsg.classList.remove('hidden');
            } else {
                passInput.classList.remove('border-error');
                if(errorMsg) errorMsg.classList.add('hidden');
                // Mock success
                console.log("Auth verified.");
            }
        });
    });
</script>
