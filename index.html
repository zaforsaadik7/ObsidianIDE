    <script>

        darkMode: "class",
        theme: {
          extend: {

    <style type="text/tailwindcss">
      @layer utilities {
        .glass-panel {
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
        }
        .animate-fade-in {
          animation: fadeIn 0.18s ease-out;
        }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-4px); }
        to   { opacity: 1; transform: translateY(0); }
      }
